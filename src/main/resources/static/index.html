<!DOCTYPE html>
<html lang="pt-BR" class="home-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoWS — Início</title>
    <link rel="stylesheet" href="/css/menu/styles-nav.css">
    <link rel="stylesheet" href="/css/home/styles-index.css">
    <script src="/js/menu/nav-dropdowns.js" defer></script>
    <script src="/js/menu/app-navbar.js" defer></script>
</head>
<body class="home-page">
    <div id="app-navbar-mount"></div>

    <main class="home-landing" aria-label="Página inicial">
        <div class="home-landing__inner">
            <img
                src="/images/promows-logo.png"
                class="home-landing__logo"
                alt="PromoWS"
                width="789"
                height="282"
            />
            <p class="home-landing__tagline">
                Sistema de promoções e painéis de preço para o seu negócio.
            </p>
            <nav class="home-social" aria-label="Contactos">
                <a
                    class="home-social__link"
                    href="https://www.instagram.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="home-social__ico" aria-hidden="true">📷</span>
                    Instagram
                </a>
                <a
                    class="home-social__link"
                    href="https://github.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="home-social__ico" aria-hidden="true">💻</span>
                    GitHub
                </a>
                <a
                    class="home-social__link"
                    href="https://wa.me/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="home-social__ico" aria-hidden="true">💬</span>
                    WhatsApp
                </a>
            </nav>
        </div>
    </main>
</body>
</html>
