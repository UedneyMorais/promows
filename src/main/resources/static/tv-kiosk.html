<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoWS — TV (promoções + preços)</title>
    <link rel="stylesheet" href="/css/menu/styles-nav.css">
    <link rel="stylesheet" href="/css/menu/styles-display-toolbar.css">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }
        /* top/left/right/bottom em vez de inset: compatível com WebKit/Chromium mais antigos (TV webOS) */
        #kiosk-frame-wrap {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            background: #000;
        }
        #kiosk-frame-wrap.is-hidden {
            opacity: 0;
        }
        #kiosk-frame {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            border: 0;
            width: 100%;
            height: 100%;
        }
        /* Barra sempre visível (TV sem rato para “revelar” UI em fullscreen) e acima do iframe */
        .board-toolbar {
            z-index: 10050;
        }
        /* Mesmo papel do board-ws-status / status de promoções: canto inferior direito */
        .kiosk-live-status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 10020;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.55);
            color: #86efac;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: none;
            font-family: system-ui, sans-serif;
        }
        html.fullscreen-mode:not(.fullscreen-ui-visible) .kiosk-live-status {
            display: none !important;
            visibility: hidden !important;
        }
        html.fullscreen-mode.fullscreen-ui-visible .kiosk-live-status {
            display: block !important;
            visibility: visible !important;
        }
    </style>
</head>
<body>
    <div class="board-toolbar">
        <button type="button" id="btn-fullscreen">Tela cheia</button>
        <div id="display-app-nav-mount"></div>
    </div>
    <div id="kiosk-live-status" class="kiosk-live-status" role="status" aria-live="off">Conectado -</div>
    <div id="kiosk-frame-wrap">
        <iframe id="kiosk-frame" title="Conteúdo TV" src="/promotions.html?kiosk=1"></iframe>
    </div>

    <script src="/js/menu/nav-dropdowns.js" defer></script>
    <script src="/js/menu/display-toolbar.js" defer></script>
    <script>
        const ROTATE_MS = 10000;
        /** Tempo do fade-out antes de trocar o src (deve combinar com transition do CSS) */
        const FADE_MS = 500;
        const KIOSK_URLS = [
            '/promotions.html?kiosk=1',
            '/prices/price-board.html?kiosk=1'
        ];

        const wrap = document.getElementById('kiosk-frame-wrap');
        const frame = document.getElementById('kiosk-frame');
        let urlIndex = 0;
        let rotateTimer = null;
        let loadFallbackTimer = null;

        function clearRotateTimer() {
            if (rotateTimer) {
                clearTimeout(rotateTimer);
                rotateTimer = null;
            }
        }

        function clearLoadFallback() {
            if (loadFallbackTimer) {
                clearTimeout(loadFallbackTimer);
                loadFallbackTimer = null;
            }
        }

        function scheduleNextRotation() {
            clearRotateTimer();
            rotateTimer = setTimeout(() => {
                rotateTimer = null;
                urlIndex = (urlIndex + 1) % KIOSK_URLS.length;
                const nextUrl = KIOSK_URLS[urlIndex];

                wrap.classList.add('is-hidden');
                setTimeout(function () {
                    var swapFinished = false;
                    function finishSwap() {
                        if (swapFinished) return;
                        swapFinished = true;
                        clearLoadFallback();
                        wrap.classList.remove('is-hidden');
                        scheduleNextRotation();
                    }

                    function onFrameLoad() {
                        frame.removeEventListener('load', onFrameLoad);
                        finishSwap();
                    }

                    /* Listener antes do src: em TVs/navegadores antigos o load pode disparar ao
                       carregar do cache antes de anexarmos o handler (tela preta permanente). */
                    frame.addEventListener('load', onFrameLoad);
                    frame.src = nextUrl;

                    function tryFinishIfCached() {
                        try {
                            var d = frame.contentDocument;
                            if (d && d.readyState === 'complete') {
                                frame.removeEventListener('load', onFrameLoad);
                                finishSwap();
                            }
                        } catch (e) {
                            /* cross-origin */
                        }
                    }
                    setTimeout(tryFinishIfCached, 0);
                    setTimeout(tryFinishIfCached, 150);

                    loadFallbackTimer = setTimeout(finishSwap, 12000);
                }, FADE_MS);
            }, ROTATE_MS);
        }

        scheduleNextRotation();

        (function kioskConnectionLabel() {
            var el = document.getElementById('kiosk-live-status');
            if (!el) return;
            function tick() {
                el.textContent = 'Conectado - ' + new Date().toLocaleTimeString();
            }
            tick();
            setInterval(tick, 1000);
        })();

        let fullscreenUiTimer = null;
        var FULLSCREEN_UI_IDLE_MS = 3500;

        function isFullscreenActive() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
        }

        function syncKioskFullscreenClass() {
            var on = isFullscreenActive();
            document.documentElement.classList.toggle('fullscreen-mode', on);
            if (!on) {
                document.documentElement.classList.remove('fullscreen-ui-visible');
                if (fullscreenUiTimer) clearTimeout(fullscreenUiTimer);
            }
        }

        function onKioskFullscreenPointerMove() {
            if (!document.documentElement.classList.contains('fullscreen-mode')) return;
            document.documentElement.classList.add('fullscreen-ui-visible');
            if (fullscreenUiTimer) clearTimeout(fullscreenUiTimer);
            fullscreenUiTimer = setTimeout(function () {
                document.documentElement.classList.remove('fullscreen-ui-visible');
            }, FULLSCREEN_UI_IDLE_MS);
        }

        document.addEventListener('fullscreenchange', syncKioskFullscreenClass);
        document.addEventListener('webkitfullscreenchange', syncKioskFullscreenClass);
        document.addEventListener('mozfullscreenchange', syncKioskFullscreenClass);
        document.addEventListener('MSFullscreenChange', syncKioskFullscreenClass);
        document.addEventListener('mousemove', onKioskFullscreenPointerMove, false);
        syncKioskFullscreenClass();

        function requestKioskFullscreen(el) {
            var fn =
                el.requestFullscreen ||
                el.webkitRequestFullscreen ||
                el.webkitRequestFullScreen ||
                el.mozRequestFullScreen ||
                el.msRequestFullscreen;
            return fn ? fn.call(el) : null;
        }

        function exitKioskFullscreen() {
            var fn =
                document.exitFullscreen ||
                document.webkitExitFullscreen ||
                document.webkitCancelFullScreen ||
                document.mozCancelFullScreen ||
                document.msExitFullscreen;
            return fn ? fn.call(document) : null;
        }

        document.getElementById('btn-fullscreen').addEventListener('click', function () {
            if (!isFullscreenActive()) {
                var el = document.documentElement;
                var p = requestKioskFullscreen(el);
                if (!p && document.body) {
                    p = requestKioskFullscreen(document.body);
                }
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {});
                }
            } else {
                var ex = exitKioskFullscreen();
                if (ex && typeof ex.catch === 'function') {
                    ex.catch(function () {});
                }
            }
        });
    </script>
</body>
</html>
