<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de preços</title>
    <link rel="stylesheet" href="/css/prices/styles-price-board.css">
    <link rel="stylesheet" href="/css/menu/styles-nav.css">
    <link rel="stylesheet" href="/css/menu/styles-display-toolbar.css">
</head>
<body>
    <script>
        (function () {
            const p = new URLSearchParams(window.location.search);
            if (p.get('kiosk') === '1') document.body.classList.add('kiosk-mode');
        })();
    </script>
    <div class="board-page">
    <img id="boardLogo" class="board-client-logo" alt="" style="display:none">
    <div class="board-toolbar">
        <button type="button" id="btn-fullscreen" title="Tela cheia">Tela cheia</button>
        <div id="display-app-nav-mount"></div>
    </div>
    <div class="price-board-root" id="root">
        <div class="board-left">
            <div class="board-category" id="categoryTitle">CARREGANDO…</div>
            <div class="board-table-wrap">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th class="col-price">Preço</th>
                        </tr>
                    </thead>
                    <tbody id="boardRows"></tbody>
                </table>
            </div>
        </div>
        <div class="board-right">
            <div class="feature-card" id="featureCard" style="display:none;">
                <div class="feature-badge" id="featureBadge">OFERTA</div>
                <h2 class="feature-title" id="featureTitle">—</h2>
                <p class="feature-pack" id="featurePack"></p>
                <div class="feature-image-wrap">
                    <img id="featureImg" alt="" src="">
                </div>
                <div class="feature-footer">
                    <span class="feature-price" id="featurePrice">0,00</span>
                    <span class="feature-unit" id="featureUnit">kg</span>
                </div>
            </div>
            <div class="board-empty" id="emptyState" style="display:none;">
                Nenhum produto ativo no painel. Cadastre itens em <strong>Cadastro</strong>.
            </div>
        </div>
    </div>
    </div>
    <div id="ws-status" class="board-ws-status connecting" role="status">Conectando…</div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="/js/menu/nav-dropdowns.js" defer></script>
    <script src="/js/menu/display-toolbar.js" defer></script>
    <script>
        const SLIDE_MS = 7000;
        const REFRESH_MS = 20000;
        const DEFAULT_IMG = '/images/promows-product-placeholder.svg';

        const socketEndpoint = '/ws-promotions';
        const priceBoardTopic = '/topic/price-board';

        let products = [];
        let slideIndex = 0;
        let slideTimer = null;
        let refreshTimer = null;
        let boardStompClient = null;
        /** TVs: timers longos em iframe costumam ser limitados; usar tick curto */
        let slideAccumMs = 0;

        function moneyBR(n) {
            const v = Number(n);
            if (!Number.isFinite(v)) return '0,00';
            return v.toFixed(2).replace('.', ',');
        }

        function rowLabel(p) {
            const parts = [p.description, p.packaging, p.unit].filter(Boolean);
            return parts.join(' ').trim();
        }

        function render() {
            const tbody = document.getElementById('boardRows');
            const empty = document.getElementById('emptyState');
            const card = document.getElementById('featureCard');
            tbody.innerHTML = '';

            if (!products.length) {
                empty.style.display = 'block';
                card.style.display = 'none';
                document.getElementById('categoryTitle').textContent = 'PAINEL DE PREÇOS';
                return;
            }

            empty.style.display = 'none';
            card.style.display = 'flex';
            slideIndex = Math.min(slideIndex, products.length - 1);

            products.forEach((p, i) => {
                const tr = document.createElement('tr');
                tr.dataset.index = String(i);
                if (i === slideIndex) tr.classList.add('row-active');
                tr.innerHTML = `
                    <td class="col-label">${escapeHtml(rowLabel(p))}</td>
                    <td class="col-price"><span class="price-pill">${moneyBR(p.price)}</span></td>`;
                tbody.appendChild(tr);
            });

            const cur = products[slideIndex];
            document.getElementById('categoryTitle').textContent = cur.categoryLabel || 'OFERTAS';
            document.getElementById('featureBadge').textContent = 'OFERTA';
            document.getElementById('featureTitle').textContent = (cur.description || '').toUpperCase();
            const packLine = [cur.packaging, cur.unit].filter(Boolean).join(' · ');
            document.getElementById('featurePack').textContent = packLine;
            document.getElementById('featurePrice').textContent = moneyBR(cur.price);
            document.getElementById('featureUnit').textContent = cur.unit || '';
            const img = document.getElementById('featureImg');
            img.src = cur.imageUrl || DEFAULT_IMG;
            img.alt = cur.description || '';
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function nextSlide() {
            if (!products.length) return;
            slideIndex = (slideIndex + 1) % products.length;
            render();
        }

        function startTimers() {
            if (slideTimer) clearInterval(slideTimer);
            slideAccumMs = 0;
            slideTimer = setInterval(function () {
                if (!products.length) return;
                slideAccumMs += 250;
                if (slideAccumMs >= SLIDE_MS) {
                    slideAccumMs = 0;
                    nextSlide();
                }
            }, 250);
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(loadData, REFRESH_MS);
        }

        function setWsStatus(kind, text) {
            const el = document.getElementById('ws-status');
            if (!el) return;
            el.textContent = text;
            el.className = 'board-ws-status' + (kind ? ' ' + kind : '');
        }

        function applyBoardFromPayload(data) {
            products = Array.isArray(data) ? data : [];
            if (products.length) {
                slideIndex = Math.min(slideIndex, products.length - 1);
            } else {
                slideIndex = 0;
            }
            render();
        }

        async function loadData() {
            try {
                const r = await fetch('/api/price-products/board');
                if (!r.ok) throw new Error('API');
                const data = await r.json();
                applyBoardFromPayload(data);
            } catch (e) {
                console.error(e);
                document.getElementById('categoryTitle').textContent = 'ERRO AO CARREGAR';
            }
        }

        function connectPriceBoardWs() {
            if (boardStompClient && boardStompClient.connected) {
                boardStompClient.disconnect();
            }
            setWsStatus('connecting', 'Conectando…');

            const socket = new SockJS(socketEndpoint);
            boardStompClient = Stomp.over(socket);
            boardStompClient.debug = () => {};

            boardStompClient.connect(
                {},
                () => {
                    setWsStatus('connected', 'Conectado - ' + new Date().toLocaleTimeString());
                    boardStompClient.subscribe(priceBoardTopic, (message) => {
                        try {
                            const data = JSON.parse(message.body);
                            setWsStatus('connected', 'Conectado - ' + new Date().toLocaleTimeString());
                            applyBoardFromPayload(data);
                        } catch (err) {
                            console.error('WebSocket painel de preços:', err);
                        }
                    });
                },
                () => {
                    setWsStatus('disconnected', 'Desconectado — reconectando…');
                    setTimeout(connectPriceBoardWs, 5000);
                }
            );
        }

        let fullscreenUiHideTimer;
        const FULLSCREEN_UI_IDLE_MS = 3500;

        function syncFullscreenModeClass() {
            const on = Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
            const html = document.documentElement;
            html.classList.toggle('fullscreen-mode', on);
            if (!on) {
                html.classList.remove('fullscreen-ui-visible');
                clearTimeout(fullscreenUiHideTimer);
            }
        }

        function onFullscreenPointerMove() {
            if (!document.documentElement.classList.contains('fullscreen-mode')) return;
            document.documentElement.classList.add('fullscreen-ui-visible');
            clearTimeout(fullscreenUiHideTimer);
            fullscreenUiHideTimer = setTimeout(() => {
                document.documentElement.classList.remove('fullscreen-ui-visible');
            }, FULLSCREEN_UI_IDLE_MS);
        }

        document.addEventListener('fullscreenchange', syncFullscreenModeClass);
        document.addEventListener('webkitfullscreenchange', syncFullscreenModeClass);
        document.addEventListener('mozfullscreenchange', syncFullscreenModeClass);
        document.addEventListener('MSFullscreenChange', syncFullscreenModeClass);
        document.addEventListener('mousemove', onFullscreenPointerMove, false);
        syncFullscreenModeClass();

        function isDocFullscreen() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
        }

        function pbRequestFs(el) {
            var fn =
                el.requestFullscreen ||
                el.webkitRequestFullscreen ||
                el.webkitRequestFullScreen ||
                el.mozRequestFullScreen ||
                el.msRequestFullscreen;
            return fn ? fn.call(el) : null;
        }

        function pbExitFs() {
            var fn =
                document.exitFullscreen ||
                document.webkitExitFullscreen ||
                document.webkitCancelFullScreen ||
                document.mozCancelFullScreen ||
                document.msExitFullscreen;
            return fn ? fn.call(document) : null;
        }

        document.getElementById('btn-fullscreen').addEventListener('click', function () {
            if (!isDocFullscreen()) {
                var el = document.documentElement;
                var p = pbRequestFs(el);
                if (!p && document.body) {
                    p = pbRequestFs(document.body);
                }
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {});
                }
            } else {
                var ex = pbExitFs();
                if (ex && typeof ex.catch === 'function') {
                    ex.catch(function () {});
                }
            }
        });
        async function applyCompanyBranding() {
            try {
                const r = await fetch('/api/company/public');
                if (!r.ok) return;
                const d = await r.json();
                const root = document.getElementById('root');
                if (d.priceBoardBackgroundUrl) {
                    const u = String(d.priceBoardBackgroundUrl).trim();
                    const forCss = u.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
                    root.style.setProperty(
                        'background',
                        'linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), url("' + forCss + '") center / cover no-repeat',
                        'important'
                    );
                } else {
                    root.style.removeProperty('background');
                }
                if (d.logoUrl) {
                    const logo = document.getElementById('boardLogo');
                    logo.src = d.logoUrl;
                    logo.alt = d.companyName || 'Logo';
                    logo.style.display = 'block';
                }
            } catch (e) {
                console.warn('Falha ao carregar marca da empresa:', e);
            }
        }

        applyCompanyBranding().then(() =>
            loadData().then(() => {
                startTimers();
                connectPriceBoardWs();
            })
        );
    </script>
</body>
</html>
