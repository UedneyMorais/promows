<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoWS - Promoções em Slide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/menu/styles-nav.css">
    <link rel="stylesheet" href="css/promotions/styles-promotions.css">
    <link rel="stylesheet" href="/css/menu/styles-display-toolbar.css">
</head>
<body>
    <script>
        (function () {
            const p = new URLSearchParams(window.location.search);
            if (p.get('kiosk') === '1') document.body.classList.add('kiosk-mode');
        })();
    </script>
    <div id="status" class="status disconnected">Desconectado</div>
    <div id="department-selector">
        <div id="department-loading">Carregando departamentos...</div>
        <select id="department-select" style="display: none;"></select>
    </div>
    <div class="board-toolbar">
        <button type="button" id="reconnect-btn">Reconectar</button>
        <button type="button" id="fullscreen-btn">TELA CHEIA</button>
        <div id="display-app-nav-mount"></div>
    </div>
    <script src="/js/menu/nav-dropdowns.js" defer></script>
    <script src="/js/menu/display-toolbar.js" defer></script>
    <div id="welcome-message">Seja bem-vindo!<br>Fique atento às nossas promoções</div>
    <div id="slider"></div>

    <div class="slide-progress">
        <svg class="progress-circle" viewBox="0 0 36 36">
            <circle class="progress-circle-bg" cx="18" cy="18" r="16"></circle>
            <circle class="progress-circle-fill" cx="18" cy="18" r="16" stroke-dasharray="100 100" stroke-dashoffset="0"></circle>
        </svg>
    </div>

    <!-- SockJS antes do Stomp (Stomp usa o cliente SockJS) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        
        // ============= CONFIGURAÇÕES GLOBAIS =============
        const serverAddress = window.location.hostname;
        const serverPort = window.location.port || '9090';
        const socketEndpoint = `/ws-promotions`;

        const promotionsTopic = "/topic/promotions";
        //const deletedPromotionsTopic = "/topic/deleted-promotions";
        const defaultImage = "https://cdn.pixabay.com/photo/2018/08/30/14/46/food-3642376_1280.jpg";

        // ============= ELEMENTOS DOM =============
        const elements = {
            status: document.getElementById('status'),
            slider: document.getElementById('slider'),
            reconnectBtn: document.getElementById('reconnect-btn'),
            fullscreenBtn: document.getElementById('fullscreen-btn'),
            welcomeMessage: document.getElementById('welcome-message'),
            departmentSelect: document.getElementById('department-select'),
            departmentLoading: document.getElementById('department-loading'),
            progressCircle: document.querySelector('.progress-circle-fill')
        };

        // ============= ESTADO GLOBAL =============
        const state = {
            stompClient: null,
            currentSlide: 0,
            /** Um único timer (100ms): TVs limitam setInterval longo dentro de iframe */
            slideIntervalId: null,
            isFullscreen: false,
            selectedDepartment: null,
            departmentKeyById: new Map(),
            activePromotionIds: new Set(),
            slideInterval: 8000, // 8 segundos
            hideDelay: 3000,
            mouseTimeout: null,
            timeLeft: 0,
            circumference: 2 * Math.PI * 16,
            /** Evita reset do carrossel quando o WS reenvia a mesma lista (ex.: TV webOS) */
            lastPromotionsSignature: null
        };

        // ============= VARIÁVEIS GLOBAIS =============
        let stompClient = null;
        let currentSlide = 0;
        const slideInterval = 8000;
        let mouseTimeout;
        const hideDelay = 3000;
        let isFullscreen = false;
        let selectedDepartment = null;
        let activePromotionIds = new Set();
        let slideIntervalId = null;

        // ============= FUNÇÕES AUXILIARES =============
        function formatDepartmentName(name) {
            if (name == null || String(name).trim() === '') return '';
            return String(name)
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-zA-Z\s]/g, '')
                .toUpperCase();
        }

        /** Evita erro se Jackson enviar BigDecimal como string no JSON */
        function formatMoney(value) {
            const n = Number(value);
            const safe = Number.isFinite(n) ? n : 0;
            return safe.toFixed(2).replace('.', ',');
        }

        function setStatus(status, message) {
            elements.status.textContent = message;
            elements.status.className = `status ${status}`;
        }

        function resetSlider() {
            document.querySelectorAll('.slide').forEach(slide => slide.remove());
            state.activePromotionIds.clear();
            elements.welcomeMessage.style.display = 'flex';
            state.currentSlide = 0;
            stopSlideShow();
        }

        async function loadDepartments() {
            try {
                const response = await fetch('/api/departments');
                if (!response.ok) throw new Error('Erro na API');
                
                const departments = await response.json();
                state.departmentKeyById = new Map();
                elements.departmentSelect.innerHTML = '';
                elements.departmentSelect.add(new Option('Todos os Departamentos', 'ALL'));
                
                departments.forEach(dept => {
                    const key = formatDepartmentName(dept.departmentName);
                    state.departmentKeyById.set(Number(dept.id), key);
                    const option = new Option(dept.departmentName, key);
                    elements.departmentSelect.add(option);
                });

                elements.departmentLoading.style.display = 'none';
                elements.departmentSelect.style.display = 'block';
                state.selectedDepartment = elements.departmentSelect.value;

            } catch (error) {
                console.error('Erro ao carregar departamentos:', error);
                elements.departmentSelect.innerHTML = `
                    <option value="ALL">Todos os Departamentos</option>
                    <option value="PADARIA">Padaria</option>
                    <option value="ACOUGUE">Açougue</option>
                `;
                elements.departmentLoading.style.display = 'none';
                elements.departmentSelect.style.display = 'block';
                state.selectedDepartment = "ALL";
            }
        }

        async function loadValidPromotions() {
            try {
                const response = await fetch('/api/promotions/valid');
                if (!response.ok) throw new Error('Erro na API');
                const promotions = await response.json();
                showPromotionSlide(promotions);
            } catch (error) {
                console.error('Erro ao carregar promoções:', error);
            }
        }

        function resolvePromotionDeptKey(promotion) {
            const name = promotion.department && promotion.department.departmentName;
            let key = formatDepartmentName(name);
            if (!key && promotion.departmentId != null && state.departmentKeyById && state.departmentKeyById.size) {
                var fromMap = state.departmentKeyById.get(Number(promotion.departmentId));
                key = fromMap != null ? fromMap : '';
            }
            return key;
        }

        function promotionsDataSignature(list) {
            var dept = state.selectedDepartment || 'ALL';
            if (!list || !list.length) {
                return dept + '|';
            }
            return dept + '|' + list.map(function (p) {
                return String(p.id) + ':' + String(p.promotionalPrice) + ':' + String(p.imageUrl || '');
            }).join('|');
        }

        function showPromotionSlide(promotions) {
            if (promotions == null) return;
            const list = Array.isArray(promotions) ? promotions : [promotions];
            var nextSig = promotionsDataSignature(list);
            if (nextSig === state.lastPromotionsSignature) {
                if (list.length === 0 && document.querySelectorAll('.slide').length === 0) return;
                if (list.length > 0 && document.querySelectorAll('.slide').length > 0) return;
            }

            resetSlider();
            list.forEach(promotion => {
                try {
                    const pid = promotion.id != null ? String(promotion.id) : '';
                    const promoDept = resolvePromotionDeptKey(promotion);
                    const shouldShow = state.selectedDepartment === 'ALL' || promoDept === state.selectedDepartment;

                    if (shouldShow && pid && !state.activePromotionIds.has(pid)) {
                        state.activePromotionIds.add(pid);
                        elements.welcomeMessage.style.display = 'none';

                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        slide.dataset.promotionId = pid;
                        const imgUrl = (promotion.imageUrl || defaultImage).replace(/'/g, "\\'");
                        slide.style.backgroundImage = `url('${imgUrl}')`;

                        slide.innerHTML = `
                            <div class="promotion-card">
                                <h2>${promotion.productName || 'Promoção'}</h2>
                                <p><strong>de R$:</strong> <span class="orig">${formatMoney(promotion.originalPrice)}</span></p>
                                <p><strong>por R$:</strong> <span class="promo">${formatMoney(promotion.promotionalPrice)}</span></p>
                                ${promotion.expirationDate ? `<p><strong>Válido até:</strong> ${new Date(promotion.expirationDate).toLocaleDateString('pt-BR')}</p>` : ''}
                            </div>
                        `;

                        elements.slider.appendChild(slide);

                        if (document.querySelectorAll('.slide').length === 1) {
                            startSlideShow();
                            slide.classList.add('active');
                            state.currentSlide = 0;
                        }
                    }
                } catch (err) {
                    console.error('Erro ao montar slide da promoção:', promotion, err);
                }
            });
            state.lastPromotionsSignature = nextSig;
        }

        function startSlideShow() {
            if (!state.slideIntervalId) {
                elements.progressCircle.style.strokeDasharray = state.circumference;
                updateProgressCircle(100);
                state.timeLeft = state.slideInterval / 1000;

                state.slideIntervalId = setInterval(function () {
                    state.timeLeft -= 0.1;
                    var maxT = state.slideInterval / 1000;
                    var progress = maxT > 0 ? (state.timeLeft / maxT) * 100 : 0;
                    if (progress < 0) progress = 0;
                    updateProgressCircle(progress);
                    if (state.timeLeft <= 0) {
                        updateSlideShow();
                        state.timeLeft = maxT;
                        updateProgressCircle(100);
                    }
                }, 100);
            }
        }

        function updateSlideShow() {
            const slides = document.querySelectorAll('.slide');

            if (slides.length === 0) {
                elements.welcomeMessage.style.display = 'flex';
                stopSlideShow();
                return;
            }
            slides.forEach(slide => slide.classList.remove('active'));
            state.currentSlide = (state.currentSlide + 1) % slides.length;
            slides[state.currentSlide].classList.add('active');
            if (window.parent !== window) {
                try {
                    window.parent.postMessage({ type: 'promo-slide-end', slideIndex: state.currentSlide }, '*');
                } catch (err) {
                    /* ignore */
                }
            }
        }

        function stopSlideShow() {
            if (state.slideIntervalId) {
                clearInterval(state.slideIntervalId);
                state.slideIntervalId = null;
                updateProgressCircle(100);
            }
        }

        function updateProgressCircle(percent) {
            const offset = state.circumference - (percent / 100) * state.circumference;
            elements.progressCircle.style.strokeDashoffset = offset;
            if (percent < 20) {
                elements.progressCircle.style.stroke = '#f44336';
            } else {
                elements.progressCircle.style.stroke = '#2196F3';
            }
        }

        // ============= FUNÇÕES DE TELA CHEIA =============   
        
        function isPromotionsFullscreen() {
            return !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
        }

        function onPromotionsFullscreenEvent() {
            const isNowFullscreen = isPromotionsFullscreen();
            state.isFullscreen = isNowFullscreen;

            if (isNowFullscreen) {
                hideControls();
                document.addEventListener('mousemove', handleMouseMove);
                resetHideTimeout();
            } else {
                showControls();
                document.removeEventListener('mousemove', handleMouseMove);

                document.body.classList.remove('fullscreen-no-cursor');

                if (state.mouseTimeout) {
                    clearTimeout(state.mouseTimeout);
                    state.mouseTimeout = null;
                }
            }
        }

        document.addEventListener('fullscreenchange', onPromotionsFullscreenEvent);
        document.addEventListener('webkitfullscreenchange', onPromotionsFullscreenEvent);
        document.addEventListener('mozfullscreenchange', onPromotionsFullscreenEvent);
        document.addEventListener('MSFullscreenChange', onPromotionsFullscreenEvent);

        function requestFs(el) {
            var fn =
                el.requestFullscreen ||
                el.webkitRequestFullscreen ||
                el.webkitRequestFullScreen ||
                el.mozRequestFullScreen ||
                el.msRequestFullscreen;
            return fn ? fn.call(el) : null;
        }

        function exitFs() {
            var fn =
                document.exitFullscreen ||
                document.webkitExitFullscreen ||
                document.webkitCancelFullScreen ||
                document.mozCancelFullScreen ||
                document.msExitFullscreen;
            return fn ? fn.call(document) : null;
        }

        function toggleFullscreen() {
            if (!isPromotionsFullscreen()) {
                var root = document.documentElement;
                var p = requestFs(root);
                if (!p && document.body) {
                    p = requestFs(document.body);
                }
                if (p && typeof p.catch === 'function') {
                    p.catch(function (err) {
                        console.error("Erro ao entrar em tela cheia:", err);
                    });
                }
            } else {
                var ex = exitFs();
                if (ex && typeof ex.catch === 'function') {
                    ex.catch(function (err) {
                        console.error("Erro ao sair da tela cheia:", err);
                    });
                }
            }
        }

        function enterFullscreen() {
            const element = document.documentElement;
            if (element.requestFullscreen) {
                element.requestFullscreen()
                    .then(() => {
                        isFullscreen = true;
                        hideControls();
                    })
                    .catch(err => {
                        console.error("Erro ao entrar em tela cheia:", err);
                        showFullscreenButton();
                    });
            }
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
            isFullscreen = false;
            showControls();
        }

        function showFullscreenButton() {
            fullscreenBtn.style.display = 'block';
            fullscreenBtn.textContent = 'TELA CHEIA';
        }

        function hideFullscreenButton() {
            fullscreenBtn.style.display = 'none';
        }

        function hideControls() {
            if (!state.isFullscreen) return;

            const controls = [
                elements.status,
                document.querySelector('.board-toolbar'),
                document.getElementById('department-selector'),
                document.querySelector('.slide-progress')
            ];
            
            controls.forEach(control => {
                if (control) control.classList.add('controls-hidden');
            });
    
            document.body.classList.add('fullscreen-no-cursor');
        }

        function showControls() {
        const controls = [
            elements.status,
            document.querySelector('.board-toolbar'),
            document.getElementById('department-selector'),
            document.querySelector('.slide-progress')
        ];
        
        controls.forEach(control => {
            if (control) control.classList.remove('controls-hidden');
        });
         document.body.classList.remove('fullscreen-no-cursor');
    }

    function handleMouseMove() {
        if (state.isFullscreen) {
            showControls();
            resetHideTimeout();
        }
    }

    function resetHideTimeout() {
        state.mouseTimeout = setTimeout(() => {
            if (state.isFullscreen) {
                hideControls();
            }
        }, state.hideDelay);
    }

    // ============= WEBSOCKET =============
        function connect(){
            setStatus("connecting", "Conectando...");

            if (state.stompClient && state.stompClient.connected) {
                state.stompClient.disconnect();
            }

            const socket = new SockJS(socketEndpoint);
            state.stompClient = Stomp.over(socket);
            state.stompClient.debug = () => {};

            state.stompClient.connect({}, () => {
                setStatus("connected", `Conectado - ${new Date().toLocaleTimeString()}`);
                loadValidPromotions();

                state.stompClient.subscribe(promotionsTopic, message => {
                    try {
                        const promotions = JSON.parse(message.body);
                        setStatus('connected', 'Conectado - ' + new Date().toLocaleTimeString());
                        showPromotionSlide(promotions);
                    } catch (e) {
                        console.error("Erro ao processar mensagem:", e);
                    }
                });
            }, (error) => {
                console.error('Erro de conexão: ', error);
                setStatus("disconnected", "Desconectado");
                setTimeout(connect, 5000);
            });

        }

    // ============= INICIALIZAÇÃO =============
    window.addEventListener('load', async () => {

        await loadDepartments();
            
        elements.departmentSelect.addEventListener('change', () => {
            state.selectedDepartment = elements.departmentSelect.value;
            state.lastPromotionsSignature = null;
            resetSlider();
            if (state.stompClient && state.stompClient.connected) loadValidPromotions();
        })  

        elements.fullscreenBtn.addEventListener('click', toggleFullscreen);
        elements.reconnectBtn.addEventListener('click', () => connect());

        connect();
    });
    </script>
</body>
</html>
